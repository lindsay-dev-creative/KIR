<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirby Lane Email Signature</title>
<!--
  Kirby Lane email signature (Lyn Norton), built from Figma KIR_2026_Email_Signature.

  Images are hosted on GitHub Pages at https://kir.lindsaydev.com/email-signature/img/
  (repo lindsay-dev-creative/KIR). They load once that folder is live on the main branch.

  Images are 2x PNGs shown at 1x size so they stay sharp on Retina screens.
  Font: Georgia stack, the closest system match to Trust 3A that Apple Mail, Gmail and Outlook all show.
-->
</head>
<body style="margin:0; padding:24px; background:#FFFFFF;">

<!-- Signature starts -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; font-family:Georgia, 'Times New Roman', serif; color:#3D3A39;">
  <!-- Name -->
  <tr>
    <td style="font-family:Georgia, 'Times New Roman', serif; font-size:20px; line-height:26px; color:#3D3A39; mso-line-height-rule:exactly;">Lyn Norton</td>
  </tr>
  <!-- Title -->
  <tr>
    <td style="padding-top:2px; font-family:Georgia, 'Times New Roman', serif; font-size:13px; line-height:18px; color:#3E4F48; mso-line-height-rule:exactly;">Owner &amp; Design Director</td>
  </tr>
  <!-- Phone -->
  <tr>
    <td style="padding-top:10px; font-family:Georgia, 'Times New Roman', serif; font-size:13px; line-height:20px; color:#3D3A39; mso-line-height-rule:exactly;">
      <a href="tel:+18645803491" style="color:#3D3A39; text-decoration:none;">(864)&nbsp;580-3491</a>
    </td>
  </tr>
  <!-- Calendly -->
  <tr>
    <td style="padding-top:2px; font-family:Georgia, 'Times New Roman', serif; font-size:13px; line-height:20px; color:#3D3A39; mso-line-height-rule:exactly;">
      <a href="https://calendly.com/designer-4/15min" style="color:#3D3A39; text-decoration:underline;">Schedule a meeting</a>
    </td>
  </tr>
  <!-- Social icons -->
  <tr>
    <td style="padding-top:10px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="padding-right:10px;">
            <a href="https://www.instagram.com/kirbylane.co" style="text-decoration:none;"><img src="https://kir.lindsaydev.com/email-signature/img/icon-instagram@2x.png" width="18" height="18" alt="Instagram" style="display:block; border:0; width:18px; height:18px;"></a>
          </td>
          <td>
            <a href="https://www.facebook.com/kirbylane.co" style="text-decoration:none;"><img src="https://kir.lindsaydev.com/email-signature/img/icon-facebook@2x.png" width="18" height="18" alt="Facebook" style="display:block; border:0; width:18px; height:18px;"></a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <!-- Rule -->
  <tr>
    <td style="padding-top:16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="236" style="border-collapse:collapse; width:236px;">
        <tr><td height="1" style="height:1px; line-height:1px; font-size:1px; background-color:#D4CFC5;">&nbsp;</td></tr>
      </table>
    </td>
  </tr>
  <!-- Logo -->
  <tr>
    <td style="padding-top:16px;">
      <img src="https://kir.lindsaydev.com/email-signature/img/kirby-lane-logo@2x.png" width="161" height="26" alt="Kirby Lane" style="display:block; border:0; width:161px; height:26px;">
    </td>
  </tr>
  <!-- Tagline -->
  <tr>
    <td style="padding-top:12px; font-family:Georgia, 'Times New Roman', serif; font-size:13px; line-height:18px; font-style:italic; color:#5B5756; mso-line-height-rule:exactly;">Known by the builders, trusted by the owners</td>
  </tr>
</table>
<!-- Signature ends -->

</body>
</html>
