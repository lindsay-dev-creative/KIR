<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirby Lane Email Signature</title>
<!--
  Kirby Lane email signature (Lyn Norton), built from Figma KIR_2026_Email_Signature.

  Images are hosted on GitHub Pages at https://kir.lindsaydev.com/email-signature/img/
  (repo lindsay-dev-creative/KIR). They load once that folder is live on the main branch.

  Images are 2x PNGs shown at 1x size so they stay sharp on Retina screens.
  Built with plain divs, no tables. Apple Mail turns pasted images into attachments
  and pulls them out of table cells, which broke the first version.
  Font: Georgia stack, the closest system match to Trust 3A that Apple Mail, Gmail and Outlook all show.
-->
</head>
<body style="margin:0; padding:24px; background:#FFFFFF;">

<!-- Signature starts -->
<div style="font-family:Georgia, 'Times New Roman', serif; color:#3D3A39; font-size:13px; line-height:20px;">
  <div style="font-size:20px; line-height:26px; color:#3D3A39;">Lyn Norton</div>
  <div style="padding-top:2px; font-size:13px; line-height:18px; color:#3E4F48;">Owner &amp; Design Director</div>
  <div style="padding-top:10px; font-size:13px; line-height:20px;"><a href="tel:+18645803491" style="color:#3D3A39; text-decoration:none;">(864)&nbsp;580-3491</a></div>
  <div style="padding-top:2px; font-size:13px; line-height:20px;"><a href="https://calendly.com/designer-4/15min" style="color:#3D3A39; text-decoration:underline;">Schedule a meeting</a></div>
  <div style="padding-top:10px; padding-bottom:16px; width:236px; border-bottom:1px solid #D4CFC5; line-height:18px;"><a href="https://www.instagram.com/kirbylane.co" style="text-decoration:none;"><img src="https://kir.lindsaydev.com/email-signature/img/icon-instagram@2x.png" width="18" height="18" alt="Instagram" style="border:0; width:18px; height:18px; vertical-align:middle;"></a>&nbsp;&nbsp;&nbsp;<a href="https://www.facebook.com/kirbylane.co" style="text-decoration:none;"><img src="https://kir.lindsaydev.com/email-signature/img/icon-facebook@2x.png" width="18" height="18" alt="Facebook" style="border:0; width:18px; height:18px; vertical-align:middle;"></a></div>
  <div style="padding-top:16px; line-height:26px;"><img src="https://kir.lindsaydev.com/email-signature/img/kirby-lane-logo@2x.png" width="161" height="26" alt="Kirby Lane" style="border:0; width:161px; height:26px; vertical-align:middle;"></div>
  <div style="padding-top:10px; font-size:13px; line-height:18px; font-style:italic; color:#5B5756;">Known by the builders, trusted by the owners</div>
</div>
<!-- Signature ends -->

</body>
</html>
