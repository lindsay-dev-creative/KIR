<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirby Lane Email Signature</title>
<!--
  Kirby Lane email signature (Lyn Norton), built from Figma KIR_2026_Email_Signature.

  Images are hosted on GitHub Pages at https://kir.lindsaydev.com/email-signature/img/
  (repo lindsay-dev-creative/KIR). They load once that folder is live on the main branch.

  Images are 2x PNGs shown at 1x size so they stay sharp on Retina screens.
  Apple Mail pulls every pasted image out of its parent box and drops any link around it.
  So nothing here wraps an image: the logo sits on its own between divs, the rule is its own
  empty div, and Instagram and Facebook are text links instead of linked icons.
  Font: Georgia stack, the closest system match to Trust 3A that Apple Mail, Gmail and Outlook all show.
-->
</head>
<body style="margin:0; padding:24px; background:#FFFFFF;">

<!-- Signature starts -->
<div style="font-family:Georgia, 'Times New Roman', serif; font-size:20px; line-height:26px; color:#3D3A39;">Lyn Norton</div>
<div style="font-family:Georgia, 'Times New Roman', serif; padding-top:2px; font-size:13px; line-height:18px; color:#3E4F48;">Owner &amp; Design Director</div>
<div style="font-family:Georgia, 'Times New Roman', serif; padding-top:10px; font-size:13px; line-height:20px; color:#3D3A39;"><a href="tel:+18645803491" style="color:#3D3A39; text-decoration:none;">(864)&nbsp;580-3491</a></div>
<div style="font-family:Georgia, 'Times New Roman', serif; padding-top:2px; font-size:13px; line-height:20px; color:#3D3A39;"><a href="https://calendly.com/designer-4/15min" style="color:#3D3A39; text-decoration:underline;">Schedule a meeting</a></div>
<div style="font-family:Georgia, 'Times New Roman', serif; padding-top:2px; font-size:13px; line-height:20px; color:#3D3A39;"><a href="https://www.instagram.com/kirbylane.co" style="color:#3D3A39; text-decoration:underline;">Instagram</a><span style="color:#A38B5B;">&nbsp;&nbsp;&middot;&nbsp;&nbsp;</span><a href="https://www.facebook.com/kirbylane.co" style="color:#3D3A39; text-decoration:underline;">Facebook</a></div>
